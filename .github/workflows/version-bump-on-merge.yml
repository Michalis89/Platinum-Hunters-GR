name: Version Bump On Production Merge

on:
  pull_request:
    types: [closed]
    branches:
      - deploy-vercel

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: deploy-vercel
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide bump type from source branch
        id: bump
        shell: bash
        run: |
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Source branch: $SOURCE_BRANCH"

          if [[ "$SOURCE_BRANCH" == feat/* ]]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif [[ "$SOURCE_BRANCH" == fix/* || "$SOURCE_BRANCH" == hotfix/* ]]; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          elif [[ "$SOURCE_BRANCH" == major/* || "$SOURCE_BRANCH" == breaking/* ]]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when branch type is not versioned
        if: steps.bump.outputs.type == 'none'
        run: echo "No version bump rule for this branch type. Skipping."

      - name: Bump package version
        if: steps.bump.outputs.type != 'none'
        run: npm version ${{ steps.bump.outputs.type }} --no-git-tag-version

      - name: Commit and push version bump
        if: steps.bump.outputs.type != 'none'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git commit -m "chore(release): bump ${{ steps.bump.outputs.type }} version [skip ci]"
          git push origin HEAD:deploy-vercel
