name: Tech debt / refactor
description: Cleanup, refactor, performance, architecture
title: "[Debt]: "
labels: ["tech-debt"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why this matters
      description: Risk, maintainability, performance impact.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      placeholder: |
        - Step 1...
        - Step 2...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] No behavior change (unless stated)
        - [ ] Tests updated/added
    validations:
      required: true
