name: Bug report
description: Something is broken and needs a fix
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1) Go to...
        2) Click...
        3) Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / files (if known)
      description: List any suspected files, routes, components.

  - type: textarea
    id: testplan
    attributes:
      label: Test plan
      placeholder: |
        - Unit:
        - Integration:
        - Manual:
